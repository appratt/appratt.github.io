backend:
  name: github
  repo: appratt/appratt.github.io
  branch: master
  # Replace with wherever your OAuth proxy ends up living
  # (e.g. https://appratt-cms-auth.your-subdomain.workers.dev)
  base_url: https://appratt-cms-auth.pages.dev/
  auth_endpoint: auth

# Where uploaded images get committed, and how they're referenced
# in Markdown. Adjust these two paths if your actual image folder
# differs from content/assets -> /assets
media_folder: "content/assets"
public_folder: "/assets"

publish_mode: simple

collections:
  - name: "content"
    label: "Pages"
    folder: "content"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    # NOTE: a plain folder collection only picks up files directly
    # inside content/, not subfolders. If your notes live in
    # subfolders (content/blog/, content/notes/, etc.), add:
    #   nested: { depth: 100 }
    # so the CMS can see and create files at any depth.
    nested: { depth: 100 }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
      - { label: "Body", name: "body", widget: "markdown" }
